# Builds the Google Play app bundle (.aab), signed with your upload key.
#
# One-time setup in GitHub: Settings -> Secrets and variables -> Actions -> New secret
#   ANDROID_KEYSTORE_BASE64   base64 of SortTheShipment-release.keystore
#   ANDROID_KEYSTORE_PASSWORD the keystore password
#   ANDROID_KEY_ALIAS         sortshipment
# Then: Actions -> "Android AAB" -> Run workflow. Under Artifacts you get the .aab for
# Google Play and SortTheShipment-ads.apk, the same build to install on your phone.
name: Android AAB

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: 4.5.2
  GODOT_RELEASE: 4.5.2-stable

jobs:
  aab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.1"

      - name: Godot and export templates
        run: |
          set -e
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}
          curl -sSL -o godot.zip $base/Godot_v${GODOT_RELEASE}_linux.x86_64.zip
          curl -sSL -o templates.tpz $base/Godot_v${GODOT_RELEASE}_export_templates.tpz
          unzip -q godot.zip && mv Godot_v${GODOT_RELEASE}_linux.x86_64 godot && chmod +x godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          TRES

      - name: Android build template
        run: python3 tools/android_setup.py

      - name: Upload key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.keystore

      - name: Import project
        run: ./godot --headless --path . --import || true

      - name: Export AAB
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/upload.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p build
          ./godot --headless --path . --export-release "Android AAB" build/SortTheShipment.aab
          # same build as an installable APK, to try the ads on your own phone
          ./godot --headless --path . --export-release "Android Test APK" build/SortTheShipment-ads.apk
          ls -la build

      - name: Check the bundle
        run: |
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          java -jar bundletool.jar validate --bundle=build/SortTheShipment.aab
          java -jar bundletool.jar dump manifest --bundle=build/SortTheShipment.aab | grep -E "targetSdkVersion|minSdkVersion|versionCode|package="
          jarsigner -verify build/SortTheShipment.aab | tail -1
          # the AdMob SDK and App ID must be inside the bundle
          java -jar bundletool.jar dump manifest --bundle=build/SortTheShipment.aab | grep -A1 "gms.ads.APPLICATION_ID" || { echo "AdMob App ID missing"; exit 1; }
          java -jar bundletool.jar dump manifest --bundle=build/SortTheShipment.aab | grep -q "AD_ID" && echo "AD_ID permission: present"
          # Google Play needs 16 KB aligned native libraries (Android 15+)
          unzip -oq build/SortTheShipment.aab 'base/lib/arm64-v8a/*' -d aab_libs
          for f in aab_libs/base/lib/arm64-v8a/*.so; do
            a=$(readelf -lW "$f" | awk '/LOAD/{print $NF}' | sort -u | tr '\n' ' ')
            echo "$(basename $f): $a"
            echo "$a" | grep -q "0x4000" || { echo "not 16 KB aligned"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: SortTheShipment-aab
          path: build/SortTheShipment.aab

      - uses: actions/upload-artifact@v4
        with:
          name: SortTheShipment-test-apk
          path: build/SortTheShipment-ads.apk
